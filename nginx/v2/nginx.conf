worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    log_format ginbar_v2 '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log ginbar_v2;

    # Per actual TCP peer: do not use X-Forwarded-For for identity.
    # 10 MiB retains bounded state; inactive addresses age out automatically.
    limit_req_zone $binary_remote_addr zone=ginbar_v2_auth:10m rate=2r/s;
    limit_req_status 429;

    upstream ginbar_v2_api {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:GINBAR_V2_SSL:10m;
        ssl_session_timeout 1d;

        root /srv/ginbar/frontend;
        index index.html;

        # Vite emits content-hashed production assets under /assets/.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        # Only processed media is public. Ingestion sources live beside this
        # directory under /srv/ginbar/media/sources and are never aliased.
        location ^~ /media/ {
            alias /srv/ginbar/media/media/;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Accept-Ranges bytes always;
            access_log off;
        }

        location ^~ /sources/ {
            return 404;
        }

        # Preserve the original Host verbatim (including an explicit port)
        # because v2 mutation authentication compares Origin against r.Host.
        # TLS terminates here, so the backend must see https as the request
        # scheme even though the upstream hop is plain HTTP.
        location = /api/v2/posts/upload {
            proxy_pass http://ginbar_v2_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Backend source bytes are capped at 256 MiB. Leave bounded
            # multipart framing headroom without making the proxy unbounded.
            client_max_body_size 257m;
            client_body_timeout 30s;
            proxy_request_buffering off;
            proxy_send_timeout 135s;
            proxy_read_timeout 135s;
        }

        location = /api/v2/posts/import-url {
            proxy_pass http://ginbar_v2_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 16k;
            proxy_send_timeout 135s;
            proxy_read_timeout 135s;
        }

        # Login and registration share one ingress budget per TCP peer.
        # Burst of 10 excess requests is allowed without delay; sustained
        # traffic above 2 requests/second is rejected with HTTP 429.
        # At a shared NAT these clients share one budget by design.
        location = /api/v2/auth/login {
            limit_req zone=ginbar_v2_auth burst=10 nodelay;
            proxy_pass http://ginbar_v2_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 1m;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        location = /api/v2/auth/register {
            limit_req zone=ginbar_v2_auth burst=10 nodelay;
            proxy_pass http://ginbar_v2_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 1m;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        location ^~ /api/ {
            proxy_pass http://ginbar_v2_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 1m;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        location = /index.html {
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
        }

        # Canonical frontend routes (/post/:id, /user/:id, /messages, ...)
        # reconstruct client state from the application shell.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store" always;
        }
    }
}
