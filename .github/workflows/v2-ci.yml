name: v2 CI

on:
  push:
    branches:
      - v2
      - 'astra/**'
    paths:
      - '.github/workflows/v2-ci.yml'
      - '.gitignore'
      - 'go.work'
      - 'nginx/v2/**'
      - 'systemd/v2/**'
      - 'scripts/v2-ci.sh'
      - 'scripts/v2-nginx-test.sh'
      - 'scripts/v2-pg-backup-test.sh'
      - 'scripts/v2-pg-backup.sh'
      - 'scripts/v2-pg-recovery-test.sh'
      - 'scripts/v2-migration-guard.py'
      - 'scripts/v2-migration-compat-test.sh'
      - 'scripts/testdata/v2-migration-compat/**'
      - 'scripts/v2-service-limits-test.sh'
      - 'scripts/v2-deploy-dry-run-test.sh'
      - 'scripts/v2-perf-regression-test.sh'
      - 'scripts/v2-worker-build.sh'
      - 'src/backend/v2/**'
      - 'src/frontend/**'
      - 'src/worker/v2/**'

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    name: correctness
    runs-on: [self-hosted, Linux, X64, amp-ci-vm]
    timeout-minutes: 45

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true

      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --short --branch

      - name: Run scoped v2 correctness gate
        shell: bash
        env:
          GINBAR_CI_BASE_SHA: ${{ github.ref_name == 'v2' && github.event.before || 'origin/v2' }}
          TMPDIR: ${{ runner.temp }}
          GINBAR_HOST_GATE_LOCK: ${{ runner.temp }}/ginbar-v2-host-gate.lock
        run: bash scripts/v2-ci.sh auto "$GINBAR_CI_BASE_SHA"

      - name: Verify target worker release build
        shell: bash
        env:
          GINBAR_CI_BASE_SHA: ${{ github.ref_name == 'v2' && github.event.before || 'origin/v2' }}
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/ginbar-worker-v2-${GITHUB_SHA}"
          bash scripts/v2-worker-build.sh --if-needed "$GINBAR_CI_BASE_SHA" "$output"
          rm -f "$output"

      - name: Verify tracked checkout remained unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
